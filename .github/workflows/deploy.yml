name: deploy

# Builds the web UI, ships the app bundle to the EC2 host via SSM (no SSH, no ECR,
# no inbound port beyond Cloudflare->80), and restarts the systemd service. Mirrors
# the manual SSM-direct deploy: tarball -> S3 -> presigned URL -> AWS-RunShellScript.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID      access key for IAM user flightrecorder-gha-deployer
#   AWS_SECRET_ACCESS_KEY  its secret
# That IAM user is scoped to ssm:SendCommand on this one instance + S3 on the deploy
# bucket only. Region / instance / bucket below are config, not secret.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-0d699e12e83b93346
  DEPLOY_BUCKET: fr-deploy-325527186655

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and upload bundle to S3
        id: pkg
        run: |
          set -euo pipefail
          KEY="fr-deploy-${GITHUB_SHA}.tgz"
          tar czf /tmp/fr-deploy.tgz --exclude='__pycache__' \
            flightrecorder web/dist runs/gentle_seed0.jsonl \
            configs/thresholds.yaml pyproject.toml README.md
          aws s3 cp /tmp/fr-deploy.tgz "s3://${DEPLOY_BUCKET}/${KEY}"
          URL=$(aws s3 presign "s3://${DEPLOY_BUCKET}/${KEY}" --expires-in 1800)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Build SSM deploy script
        run: |
          set -euo pipefail
          cat > /tmp/script.sh <<EOF
          set -e
          rm -rf /opt/flight-recorder && mkdir -p /opt/flight-recorder
          curl -fsSL "${{ steps.pkg.outputs.url }}" -o /tmp/fr-deploy.tgz
          tar xzf /tmp/fr-deploy.tgz -C /opt/flight-recorder
          apt-get update -y
          apt-get install -y python3-venv python3-pip
          python3 -m venv /opt/flight-recorder/venv
          /opt/flight-recorder/venv/bin/pip install --upgrade pip wheel
          cd /opt/flight-recorder && /opt/flight-recorder/venv/bin/pip install ".[server]"
          printf '%s\n' \
            '[Unit]' \
            'Description=Flight Recorder honest demo' \
            'After=network.target' \
            '[Service]' \
            'Environment=FLIGHTRECORDER_RUNS=/opt/flight-recorder/runs' \
            'Environment=FLIGHTRECORDER_STATIC=/opt/flight-recorder/web/dist' \
            'ExecStart=/opt/flight-recorder/venv/bin/uvicorn flightrecorder.server.app:create_app --factory --host 0.0.0.0 --port 80' \
            'Restart=always' \
            '[Install]' \
            'WantedBy=multi-user.target' \
            > /etc/systemd/system/flightrecorder.service
          systemctl daemon-reload
          systemctl enable flightrecorder.service
          systemctl restart flightrecorder.service
          sleep 10
          curl -fsS http://localhost:80/health && echo FR_HEALTH_OK
          EOF
          jq -n --rawfile s /tmp/script.sh \
            '{commands: ($s | rtrimstr("\n") | split("\n"))}' > /tmp/params.json

      - name: Send SSM command and wait
        run: |
          set -euo pipefail
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deploy ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)
          echo "Command: $CID"
          aws ssm wait command-executed --command-id "$CID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "----- stdout (tail) -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text | tail -30
          echo "----- status: $STATUS -----"
          test "$STATUS" = "Success"

      - name: Verify public health
        run: |
          set -euo pipefail
          code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' https://flightrecorder.aarav-shah.com/health)
          echo "https health: $code"
          test "$code" = "200"
